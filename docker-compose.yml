services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pern_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-pern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema-upgraded.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/migrations/add-missing-columns.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-pern_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
      PGDATABASE: ${POSTGRES_DB:-pern_ecommerce}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-local-secret}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
